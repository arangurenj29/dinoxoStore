name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check formatting
        run: corepack pnpm format:check

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Unit tests
        run: corepack pnpm test:unit

      - name: Validate brand assets
        run: python3 brand/tools/validate_brand.py

      - name: Build preview
        env:
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_preview-ci-fixture
          PUBLIC_SUPABASE_URL: https://preview-ci.invalid
        run: corepack pnpm build:preview

      - name: Verify preview artifacts
        run: corepack pnpm test:static:preview

      - name: Build production
        run: corepack pnpm build:production

      - name: Verify production artifacts
        run: corepack pnpm test:static:production

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.101.0

      - name: Start isolated local database and apply migrations
        run: supabase db start

      - name: Run pgTAP schema and behavior tests locally
        run: supabase test db --local

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  deploy:
    needs: [storefront, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build production storefront
        run: corepack pnpm build:production

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/storefront
          wranglerVersion: 4.118.0
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verify production HTTP surface
        run: node scripts/production-smoke.mjs
